services:
  blockchain:
    build: ./blockchain
    restart: always
    container_name: blockproctor-blockchain
    ports:
      - "8545:8545"
    volumes:
      - ./blockchain:/app
      - blockchain_data:/app/data
      - ./blockchain/artifacts:/shared/artifacts

  postgres:
    image: postgres:15
    container_name: blockproctor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: blockproctor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blockproctor-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./blockchain/artifacts:/blockchain/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: blockproctor-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"    

volumes:
  postgres_data:
  blockchain_data:

